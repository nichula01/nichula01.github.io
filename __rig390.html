<!DOCTYPE html><html><head><meta charset="utf-8"><title>o</title>
<style>html,body{margin:0;background:#fff}iframe{border:0;display:block}</style></head>
<body><iframe id="f" src="index.html" width="390" height="4400" scrolling="no"></iframe>
<script>
document.getElementById('f').addEventListener('load', function(){
  var w=this.contentWindow,d=w.document;
  setTimeout(function(){
    function o(sel){var e=d.querySelector(sel);if(!e)return '0,0';var r=e.getBoundingClientRect();return Math.round(r.top+w.scrollY)+','+Math.round(r.height);}
    parent.document.title=['PAGEH='+d.documentElement.scrollHeight,'hero='+o('.hero'),'tiles='+o('.tiles'),'editorial='+o('.editorial'),'footprint='+o('.footprint'),'footer='+o('.site-footer')].join(' | ');
  },700);
});
</script></body></html>
